<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareReady</title>
  <meta name="description" content="AI-powered patient education handouts for home health clinicians." />
  <meta name="theme-color" content="#1a5276" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CareReady" />
  <style>* { box-sizing: border-box; } body { margin: 0; padding: 0; } @keyframes spin { to { transform: rotate(360deg); } }</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react" data-type="module">
const { useState, useRef, useEffect } = React;

const DISEASE_GROUPS = [
  { label: "Cardiac", diseases: ["Congestive Heart Failure (CHF)","Coronary Artery Disease (CAD)","Atrial Fibrillation (AFib)","Hypertension","Heart Attack (Myocardial Infarction)","Deep Vein Thrombosis (DVT)","Peripheral Artery Disease (PAD)"] },
  { label: "Respiratory", diseases: ["COPD","Asthma","Pneumonia","Pulmonary Embolism (PE)","Sleep Apnea"] },
  { label: "Metabolic / Endocrine", diseases: ["Type 2 Diabetes","Type 1 Diabetes","Hypoglycemia","Hypothyroidism","Hyperthyroidism","Obesity"] },
  { label: "Renal / GI", diseases: ["Chronic Kidney Disease (CKD)","Dialysis Care","Urinary Tract Infection (UTI)","Constipation Management","GERD / Acid Reflux","Colostomy / Ostomy Care"] },
  { label: "Neurological", diseases: ["Stroke / CVA","Parkinson's Disease","Dementia / Alzheimer's","Seizure Disorder / Epilepsy","Multiple Sclerosis (MS)","Neuropathy"] },
  { label: "Musculoskeletal", diseases: ["Osteoporosis","Fall Prevention","Hip Replacement Recovery","Knee Replacement Recovery","Arthritis"] },
  { label: "Wound / Skin", diseases: ["Wound Care / Pressure Injuries","Diabetic Foot Ulcers","Cellulitis","Post-Surgical Wound Care"] },
  { label: "Mental Health", diseases: ["Depression","Anxiety","Medication Management"] },
  { label: "Other / Specialty", diseases: ["Sepsis Warning Signs","Pain Management","Hospice / Comfort Care","Catheter Care","Feeding Tube Care (PEG/NG)","IV / PICC Line Care","Oxygen Therapy at Home","Blood Thinner / Anticoagulation"] },
];

const ACCENT_COLORS = [
  { name: "Navy", value: "#1a5276" },
  { name: "Forest Green", value: "#1a6b3c" },
  { name: "Burgundy", value: "#7b1c2e" },
  { name: "Slate Blue", value: "#2e4a7a" },
  { name: "Teal", value: "#0e6e72" },
  { name: "Charcoal", value: "#2c3e50" },
];

const DEFAULT_SETTINGS = {
  agencyName: "", doctorName: "", doctorPhone: "", nursePhone: "",
  clinicianName: "", accentColor: "#1a5276", customDisclaimer: "", logoDataUrl: null,
};

// ── Get API key from meta tag (set by Vercel env) or prompt user
function getApiKey() {
  return window.ANTHROPIC_API_KEY || "";
}

function App({ agencyName }) {
  const [tab, setTab] = useState("generate");
  const [settings, setSettings] = useState(() => {
    try {
      const saved = localStorage.getItem("careready_settings");
      return saved ? { ...DEFAULT_SETTINGS, ...JSON.parse(saved) } : DEFAULT_SETTINGS;
    } catch { return DEFAULT_SETTINGS; }
  });
  const [patientName, setPatientName] = useState("");
  const [selectedConditions, setSelectedConditions] = useState([]);
  const [disease, setDisease] = useState("");
  const [customDisease, setCustomDisease] = useState("");
  const [woundCareOrders, setWoundCareOrders] = useState("");
  const [clinicianNotes, setClinicianNotes] = useState("");
  const [therapyExercises, setTherapyExercises] = useState("");
  const [manualNotes, setManualNotes] = useState("");
  const [readingLevel, setReadingLevel] = useState("plain");
  const [language, setLanguage] = useState("english");
  const [pageLayout, setPageLayout] = useState("one");
  const [loading, setLoading] = useState(false);
  const [output, setOutput] = useState(null);
  const [error, setError] = useState(null);
  const [pdfLoading, setPdfLoading] = useState(false);
  const printRef = useRef();
  const pdfRef = useRef();
  const logoInputRef = useRef();

  const ac = settings.accentColor;
  const finalDisease = selectedConditions.join(", ");
  const isWoundCare = selectedConditions.some(c => /wound|ulcer|post-surgical/i.test(c));
  const setSetting = (k, v) => setSettings(s => {
    const updated = { ...s, [k]: v };
    // Doctor name/phone are per-patient — don't persist them as defaults
    const toSave = { ...updated, doctorName: "", doctorPhone: "" };
    try { localStorage.setItem("careready_settings", JSON.stringify(toSave)); } catch {}
    return updated;
  });

  const handleLogoUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => setSetting("logoDataUrl", ev.target.result);
    reader.readAsDataURL(file);
  };

  const addCondition = (cond) => {
    const c = cond.trim();
    if (!c) return;
    if (selectedConditions.includes(c)) return;
    setSelectedConditions(prev => [...prev, c]);
  };
  const removeCondition = (cond) => {
    setSelectedConditions(prev => prev.filter(c => c !== cond));
  };

  const handleNewPatient = () => {
    setPatientName("");
    setSelectedConditions([]);
    setDisease("");
    setCustomDisease("");
    setWoundCareOrders("");
    setClinicianNotes("");
    setTherapyExercises("");
    setManualNotes("");
    setOutput(null);
    setError(null);
    setSetting("doctorName", "");
    setSetting("doctorPhone", "");
  };

  const handleGenerate = async () => {
    if (selectedConditions.length === 0) { setError("Please add at least one condition."); return; }
    // API key is handled server-side
    setError(null); setLoading(true); setOutput(null);

    const levelDesc = readingLevel === "plain"
      ? "Use very simple language at a 6th grade reading level. Short sentences. No jargon."
      : "Use standard clinical language for patient education.";
    const langNote = language === "spanish"
      ? "Write ALL content in Spanish."
      : "Write in English.";

    const woundOrdersNote = (isWoundCare && woundCareOrders.trim())
      ? `\n\nThe clinician has provided the following EXACT wound care orders from the physician. Convert these into clear, numbered, easy-to-follow steps for the patient/caregiver — do not change the medical instructions, just make them easy to understand and put in logical order:\n"""${woundCareOrders.trim()}"""\nInclude these as a "woundCareSteps" array of strings (each string = one numbered step) in the JSON.`
      : "";

    const clinicianNotesNote = clinicianNotes.trim()
      ? `\n\nThe clinician has provided these specific guidelines/recommendations for this patient — incorporate these naturally into the relevant sections (keyFacts, dailyTips, or as a dedicated "specialInstructions" array of strings):\n"""${clinicianNotes.trim()}"""`
      : "";

    const therapyNote = therapyExercises.trim()
      ? `\n\nThe therapist has prescribed the following exercises for this patient. Format these as a "therapyExercises" array in the JSON. Each item should be an object with: "name" (exercise name), "description" (how to do it in plain language), "reps" (frequency/repetitions), "precautions" (what to avoid or watch for):\n"""${therapyExercises.trim()}"""`
      : "";

    const multiNote = selectedConditions.length > 1
      ? `\n\nThe patient has MULTIPLE conditions: ${selectedConditions.join(", ")}. Address ALL of them together in one cohesive handout — "whatIsIt" should briefly cover each condition, "keyFacts" and "dailyTips" should include relevant items for each condition (label which condition each relates to where helpful), and the zone tools/diet should reflect the COMBINED picture for managing all conditions together (e.g. if there's a dietary conflict between conditions, note how to balance it).`
      : "";

    const prompt = `You are an expert home health nurse educator. Generate a complete patient education handout.
Disease/Topic(s): ${finalDisease}
Patient: ${patientName || "Patient"}
Reading level: ${levelDesc}
Language: ${langNote}${multiNote}${woundOrdersNote}${clinicianNotesNote}${therapyNote}
Return ONLY a valid JSON object — no markdown, no preamble:
{"title":"handout title${selectedConditions.length>1?" (mention all conditions)":""}","whatIsIt":"explanation covering ${selectedConditions.length>1?"each condition":"the condition"}","keyFacts":["fact","fact","fact","fact"${selectedConditions.length>1?',"fact","fact"':""}],"dailyTips":["tip","tip","tip","tip","tip"${selectedConditions.length>1?',"tip","tip"':""}]${clinicianNotes.trim()?',"specialInstructions":["instruction 1","instruction 2","instruction 3"]':""}${(isWoundCare && woundCareOrders.trim()) ? ',"woundCareSteps":["step 1","step 2","step 3"]' : ""}${therapyExercises.trim()?',"therapyExercises":[{"name":"exercise name","description":"how to do it","reps":"frequency and reps","precautions":"what to avoid"}]':""},"diet":{"intro":"1 sentence intro","eat":["food","food","food","food"],"avoid":["food","food","food","food"]},"greenZone":{"label":"Green Zone — Doing Well","description":"stable signs","signs":["sign","sign","sign"],"action":"Keep following your care plan as instructed."},"yellowZone":{"label":"Yellow Zone — Caution","description":"warning signs","signs":["sign","sign","sign","sign"],"action":"Call your nurse or doctor today."},"redZone":{"label":"Red Zone — Emergency","description":"emergency signs","signs":["sign","sign","sign"],"action":"Call 911 or go to the ER immediately."},"callNurseIf":["reason","reason","reason","reason"],"footer":"Short encouraging closing sentence"}`;

    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      const data = await res.json();
      if (data.error) { setError("Error: " + data.error); setLoading(false); return; }
      const clean = (data.text || "").replace(/```json|```/g, "").trim();
      try {
        setOutput(JSON.parse(clean));
      } catch (parseErr) {
        // Attempt to repair truncated JSON by closing open strings/brackets
        let repaired = clean;
        // If it ends mid-string, close the string
        const quoteCount = (repaired.match(/(?<!\\)"/g) || []).length;
        if (quoteCount % 2 !== 0) repaired += '"';
        // Trim trailing comma
        repaired = repaired.replace(/,\s*$/, "");
        // Close any unclosed arrays/objects based on bracket balance
        const openBraces = (repaired.match(/{/g)||[]).length - (repaired.match(/}/g)||[]).length;
        const openBrackets = (repaired.match(/\[/g)||[]).length - (repaired.match(/\]/g)||[]).length;
        repaired += "]".repeat(Math.max(0,openBrackets)) + "}".repeat(Math.max(0,openBraces));
        try {
          setOutput(JSON.parse(repaired));
        } catch {
          setError("The handout was too long and got cut off. Please try again — try removing one condition or switching to 'One page' layout.");
        }
      }
    } catch(e) {
      setError("Generation failed: " + (e?.message || "Unknown error") + ". Please try again.");
    } finally { setLoading(false); }
  };

  const handlePrint = () => {
    const content = printRef.current?.innerHTML;
    if (!content) return;
    const w = window.open("", "_blank");
    w.document.write(`<!DOCTYPE html><html><head><title>CareReady</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Georgia,serif;color:#111;background:#fff;padding:${pageLayout==="two"?"22px 28px":"14px 20px"}}p{font-size:${pageLayout==="two"?"13px":"11px"};line-height:1.7;color:#333}ul{padding-left:17px}li{font-size:${pageLayout==="two"?"12px":"11px"};line-height:1.7;color:#333}@media print{body{padding:8px 12px}}</style></head><body>${content}</body></html>`);
    w.document.close(); w.print();
  };

  const handleDownloadPDF = async () => {
    const el = pdfRef.current; if (!el) return;
    setPdfLoading(true);
    const filename = `${(patientName||"patient").replace(/\s+/g,"-")}-${finalDisease.replace(/[\s/()]+/g,"-").toLowerCase()}-education.pdf`;
    try {
      await window.html2pdf().set({ margin:[8,10,8,10], filename, image:{type:"jpeg",quality:0.98}, html2canvas:{scale:2,useCORS:true}, jsPDF:{unit:"mm",format:"letter",orientation:"portrait"} }).from(el).save();
    } catch { alert("PDF download failed. Use Print instead."); }
    finally { setPdfLoading(false); }
  };

  const hasContacts = settings.doctorName || settings.doctorPhone || settings.nursePhone || settings.clinicianName;

  return (
    <div style={{minHeight:"100vh",background:"#f0f4f8",fontFamily:"'Inter','Segoe UI',sans-serif"}}>
      <div style={{background:ac,color:"white",padding:"18px 28px"}}>
        <div style={{maxWidth:980,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:11,letterSpacing:"0.12em",textTransform:"uppercase",opacity:0.7,marginBottom:3}}>Patient Education</div>
            <div style={{fontSize:20,fontWeight:700}}>CareReady</div>
            {settings.agencyName && <div style={{fontSize:12,opacity:0.8,marginTop:2}}>{settings.agencyName}</div>}
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <TabBtn active={tab==="generate"} ac={ac} onClick={()=>setTab("generate")}>Generate</TabBtn>
            <TabBtn active={tab==="settings"} ac={ac} onClick={()=>setTab("settings")}>⚙ Settings</TabBtn>
            <button onClick={()=>{ if(window.confirm("Sign out of CareReady on this device?")){ localStorage.removeItem("careready_access_code"); window.location.reload(); } }}
              title="Sign out / switch access code"
              style={{background:"transparent",color:"white",border:"1px solid rgba(255,255,255,0.35)",borderRadius:6,padding:"7px 12px",fontSize:13,cursor:"pointer"}}>
              ⎋
            </button>
          </div>
        </div>
      </div>

      <div style={{maxWidth:980,margin:"0 auto",padding:"22px 16px"}}>

        {tab==="settings" && (
          <div style={{background:"white",borderRadius:10,padding:24,boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
            <FLabel ac={ac}>Agency Branding</FLabel>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:20}}>
              <div>
                <label style={lbl}>Agency Name</label>
                <input value={settings.agencyName} onChange={e=>setSetting("agencyName",e.target.value)} placeholder="e.g. Caring Hands Home Health" style={inp} />
              </div>
              <div>
                <label style={lbl}>Agency Logo</label>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <button onClick={()=>logoInputRef.current?.click()} style={{...inp,cursor:"pointer",background:"#f0f4f8",color:ac,fontWeight:600,fontSize:12,textAlign:"center",border:`1px dashed ${ac}`}}>
                    {settings.logoDataUrl?"✓ Logo Uploaded":"Upload Logo"}
                  </button>
                  {settings.logoDataUrl && <button onClick={()=>setSetting("logoDataUrl",null)} style={{background:"none",border:"none",color:"#c0392b",cursor:"pointer",fontSize:20}}>×</button>}
                </div>
                <input ref={logoInputRef} type="file" accept="image/*" onChange={handleLogoUpload} style={{display:"none"}} />
                {settings.logoDataUrl && <img src={settings.logoDataUrl} alt="logo" style={{marginTop:6,maxHeight:40,maxWidth:120,objectFit:"contain"}} />}
              </div>
            </div>
            <div style={{marginBottom:20}}>
              <label style={lbl}>Brand Color</label>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:4}}>
                {ACCENT_COLORS.map(c=>(
                  <button key={c.value} onClick={()=>setSetting("accentColor",c.value)} title={c.name} style={{width:36,height:36,borderRadius:"50%",background:c.value,border:settings.accentColor===c.value?"3px solid #fff":"2px solid transparent",outline:settings.accentColor===c.value?`3px solid ${c.value}`:"none",cursor:"pointer"}} />
                ))}
                <input type="color" value={settings.accentColor} onChange={e=>setSetting("accentColor",e.target.value)} style={{width:36,height:36,border:"none",borderRadius:"50%",cursor:"pointer",padding:0}} />
              </div>
            </div>
            <FLabel ac={ac}>Contact Information</FLabel>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:20}}>
              <div><label style={lbl}>Doctor Name</label><input value={settings.doctorName} onChange={e=>setSetting("doctorName",e.target.value)} placeholder="e.g. Dr. Rachel Patel" style={inp} /></div>
              <div><label style={lbl}>Doctor Phone</label><input value={settings.doctorPhone} onChange={e=>setSetting("doctorPhone",e.target.value)} placeholder="(919) 555-0100" style={inp} /></div>
              <div><label style={lbl}>Nurse / Agency Phone</label><input value={settings.nursePhone} onChange={e=>setSetting("nursePhone",e.target.value)} placeholder="(919) 555-0200" style={inp} /></div>
              <div><label style={lbl}>Clinician Name</label><input value={settings.clinicianName} onChange={e=>setSetting("clinicianName",e.target.value)} placeholder="e.g. Jenn, RN" style={inp} /></div>
            </div>
            <div style={{marginTop:16,padding:"12px 16px",background:"#eafaf1",borderRadius:8,border:"1px solid #a9dfbf",fontSize:13,color:"#1e8449",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
              <span>✓ Agency name, logo, brand color, nurse/agency phone, clinician name, and disclaimer are saved automatically. Doctor name & phone reset for each new patient.</span>
              <button onClick={()=>{ if(window.confirm("Clear all saved agency settings?")) { localStorage.removeItem("careready_settings"); setSettings(DEFAULT_SETTINGS); } }} style={{background:"white",color:"#c0392b",border:"1px solid #c0392b",borderRadius:6,padding:"5px 14px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Clear Saved Info</button>
            </div>
          </div>
        )}

        {tab==="generate" && (
          <>
            
            <div style={{background:"white",borderRadius:10,padding:24,marginBottom:22,boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
              <FLabel ac={ac}>Patient Info</FLabel>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:18}}>
                <div><label style={lbl}>Patient Name</label><input value={patientName} onChange={e=>setPatientName(e.target.value)} placeholder="e.g. Jane Smith" style={inp} /></div>
                <div><label style={lbl}>Language</label>
                  <select value={language} onChange={e=>setLanguage(e.target.value)} style={inp}>
                    <option value="english">English</option>
                    <option value="spanish">Spanish (Español)</option>
                  </select>
                </div>
              </div>
              <FLabel ac={ac}>Handout Settings</FLabel>
              <div style={{marginBottom:14}}>
                <label style={lbl}>Conditions * <span style={{textTransform:"none",fontWeight:400,color:"#999"}}>(add one or more)</span></label>
                <div style={{display:"flex",gap:10}}>
                  <select value={disease} onChange={e=>{
                      const v = e.target.value;
                      if (v === "__custom__") { setDisease(v); return; }
                      if (v) { addCondition(v); setDisease(""); }
                    }} style={{...inp,flex:1}}>
                    <option value="">Select a condition to add…</option>
                    {DISEASE_GROUPS.map(g=>(
                      <optgroup key={g.label} label={g.label}>
                        {g.diseases.map(d=><option key={d} value={d}>{d}</option>)}
                      </optgroup>
                    ))}
                    <option value="__custom__">+ Enter custom condition…</option>
                  </select>
                </div>
                {disease==="__custom__" && (
                  <div style={{display:"flex",gap:8,marginTop:10}}>
                    <input value={customDisease} onChange={e=>setCustomDisease(e.target.value)}
                      onKeyDown={e=>{ if(e.key==="Enter" && customDisease.trim()){ addCondition(customDisease.trim()); setCustomDisease(""); setDisease(""); } }}
                      placeholder="e.g. Sickle Cell Disease, Lupus… (press Enter to add)" style={{...inp,flex:1}} autoFocus />
                    <button onClick={()=>{ if(customDisease.trim()){ addCondition(customDisease.trim()); setCustomDisease(""); setDisease(""); } }}
                      style={{background:ac,color:"white",border:"none",borderRadius:6,padding:"9px 18px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Add</button>
                  </div>
                )}
                {selectedConditions.length > 0 && (
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:10}}>
                    {selectedConditions.map(c=>(
                      <div key={c} style={{display:"flex",alignItems:"center",gap:6,background:"#eaf0fb",border:`1px solid ${ac}`,borderRadius:20,padding:"5px 12px",fontSize:12,color:ac,fontWeight:600}}>
                        {c}
                        <button onClick={()=>removeCondition(c)} style={{background:"none",border:"none",color:ac,cursor:"pointer",fontSize:15,fontWeight:700,lineHeight:1,padding:0}}>×</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:18}}>
                <div><label style={lbl}>Reading Level</label>
                  <select value={readingLevel} onChange={e=>setReadingLevel(e.target.value)} style={inp}>
                    <option value="plain">Plain Language (6th grade)</option>
                    <option value="standard">Standard (clinical)</option>
                  </select>
                </div>
                <div><label style={lbl}>Print Layout</label>
                  <select value={pageLayout} onChange={e=>setPageLayout(e.target.value)} style={inp}>
                    <option value="one">One page (condensed)</option>
                    <option value="two">Two pages (detailed)</option>
                  </select>
                </div>
              </div>
              {isWoundCare && (
                <div style={{marginBottom:18}}>
                  <label style={lbl}>Wound Care Orders from Physician (optional)</label>
                  <textarea value={woundCareOrders} onChange={e=>setWoundCareOrders(e.target.value)}
                    placeholder="Paste or type the exact wound care orders, e.g. 'Cleanse with normal saline, apply Medihoney to wound bed, cover with foam dressing, change every 3 days...'"
                    style={{...inp,height:90,resize:"vertical",fontFamily:"inherit"}} />
                  <div style={{fontSize:12,color:"#888",marginTop:5}}>If provided, these will be turned into clear step-by-step instructions for the patient/caregiver.</div>
                </div>
              )}

              <div style={{marginBottom:18}}>
                <label style={lbl}>Specific Patient Guidelines / Clinician Recommendations (optional)</label>
                <textarea value={clinicianNotes} onChange={e=>setClinicianNotes(e.target.value)}
                  placeholder="e.g. 'Patient must limit fluids to 1.5L/day, call if weight increases more than 2 lbs overnight, avoid NSAIDs, follow low-sodium diet strictly...'"
                  style={{...inp,height:80,resize:"vertical",fontFamily:"inherit"}} />
                <div style={{fontSize:12,color:"#888",marginTop:5}}>These specific guidelines will be woven into the handout as patient instructions.</div>
              </div>

              <div style={{marginBottom:18}}>
                <label style={lbl}>Therapy Exercises (optional — for PT/OT/SLP orders)</label>
                <textarea value={therapyExercises} onChange={e=>setTherapyExercises(e.target.value)}
                  placeholder="e.g. 'Ankle pumps: 10 reps 3x/day, avoid if pain increases. Quad sets: 10 reps 3x/day. Short arc quads: 10 reps 2x/day, stop if swelling increases...'"
                  style={{...inp,height:90,resize:"vertical",fontFamily:"inherit"}} />
                <div style={{fontSize:12,color:"#888",marginTop:5}}>Exercises will be formatted with name, description, frequency/reps, and precautions on the handout.</div>
              </div>

              {error && <div style={{color:"#c0392b",fontSize:13,marginBottom:12}}>{error}</div>}
              <button onClick={handleGenerate} disabled={loading} style={{background:loading?"#aaa":ac,color:"white",border:"none",borderRadius:6,padding:"11px 32px",fontSize:14,fontWeight:600,cursor:loading?"not-allowed":"pointer"}}>
                {loading?"Generating handout…":"Generate Handout"}
              </button>
            </div>

            {output && (
              <>
                <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginBottom:12,flexWrap:"wrap"}}>
                  <button onClick={handleNewPatient} style={{background:"white",color:ac,border:`2px solid ${ac}`,borderRadius:6,padding:"8px 22px",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                    🔄 New Patient
                  </button>
                  <button onClick={handleDownloadPDF} disabled={pdfLoading} style={{background:pdfLoading?"#aaa":"#e67e22",color:"white",border:"none",borderRadius:6,padding:"8px 22px",fontSize:13,fontWeight:600,cursor:pdfLoading?"not-allowed":"pointer"}}>
                    {pdfLoading?"Preparing PDF…":"⬇ Download PDF"}
                  </button>
                  <button onClick={handlePrint} style={{background:"#27ae60",color:"white",border:"none",borderRadius:6,padding:"8px 22px",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                    🖨️ Print Handout
                  </button>
                </div>
                <div style={{position:"absolute",left:-9999,top:0,width:816,background:"white",padding:"18px 22px"}}>
                  <div ref={pdfRef}><Handout output={output} settings={settings} patientName={patientName} ac={ac} pageLayout={pageLayout} hasContacts={hasContacts} language={language} manualNotes={manualNotes} setManualNotes={setManualNotes} /></div>
                </div>
                <div ref={printRef} style={{background:"white",borderRadius:10,padding:"26px 30px",boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
                  <Handout output={output} settings={settings} patientName={patientName} ac={ac} pageLayout={pageLayout} hasContacts={hasContacts} language={language} manualNotes={manualNotes} setManualNotes={setManualNotes} />
                </div>
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function Handout({output,settings,patientName,ac,pageLayout,hasContacts,language,manualNotes,setManualNotes}) {
  const compact = pageLayout==="one";
  const fs = compact?11:13;
  const mb = compact?12:18;
  const sp = language==="spanish";
  return (
    <div style={{fontFamily:"Georgia,serif",color:"#111"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",borderBottom:`3px solid ${ac}`,paddingBottom:12,marginBottom:16}}>
        <div>
          <div style={{fontSize:compact?17:21,fontWeight:700,color:ac}}>{output.title}</div>
          {patientName && <div style={{fontSize:12,color:"#555",marginTop:4}}>{sp?"Preparado para":"Prepared for"}: <strong>{patientName}</strong></div>}
          <div style={{fontSize:11,color:"#888",marginTop:2}}>{sp?"Fecha":"Date"}: {new Date().toLocaleDateString()}</div>
          {settings.clinicianName && <div style={{fontSize:11,color:"#888",marginTop:1}}>{sp?"Clínico":"Clinician"}: {settings.clinicianName}</div>}
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5}}>
          {settings.logoDataUrl && <img src={settings.logoDataUrl} alt="logo" style={{maxHeight:52,maxWidth:150,objectFit:"contain"}} />}
          {settings.agencyName && <div style={{fontSize:12,color:"#555",fontStyle:"italic"}}>{settings.agencyName}</div>}
        </div>
      </div>

      {hasContacts && (
        <div style={{background:"#f4f6f9",border:"1px solid #ccd6e0",borderRadius:7,padding:"10px 16px",marginBottom:mb,display:"flex",gap:28,flexWrap:"wrap"}}>
          {settings.doctorName && <CI label={sp?"Médico":"Physician"} value={settings.doctorName} ac={ac} />}
          {settings.doctorPhone && <CI label={sp?"Tel. Médico":"Doctor Phone"} value={settings.doctorPhone} ac={ac} bold />}
          {settings.nursePhone && <CI label={sp?"Enfermera":"Nurse / Agency"} value={settings.nursePhone} ac={ac} bold />}
          <CI label={sp?"Emergencia":"Emergency"} value="911" ac="#c0392b" bold red />
        </div>
      )}

      <Sec title={sp?"¿Qué es esta condición?":"What Is This Condition?"} ac={ac} mb={mb}>
        <p style={{fontSize:fs,lineHeight:1.75,color:"#333"}}>{output.whatIsIt}</p>
      </Sec>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18,marginBottom:mb}}>
        <Sec title={sp?"Datos Clave":"Key Facts"} ac={ac} mb={0}><BL items={output.keyFacts} fs={fs} /></Sec>
        <Sec title={sp?"Consejos Diarios":"Daily Tips"} ac={ac} mb={0}><BL items={output.dailyTips} fs={fs} /></Sec>
      </div>

      {output.woundCareSteps && output.woundCareSteps.length > 0 && (
        <div style={{background:"#eaf6fb",border:"2px solid #2980b9",borderRadius:7,padding:"11px 16px",marginBottom:mb}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.09em",color:"#1a5276",marginBottom:7}}>
            🩹 {sp?"Pasos para el Cuidado de la Herida (Según las Órdenes del Médico)":"Wound Care Steps (Per Doctor's Orders)"}
          </div>
          <ol style={{paddingLeft:20,margin:0}}>
            {output.woundCareSteps.map((s,i)=><li key={i} style={{fontSize:fs,lineHeight:1.8,color:"#333",marginBottom:3}}>{s}</li>)}
          </ol>
        </div>
      )}

      {output.specialInstructions && output.specialInstructions.length > 0 && (
        <div style={{background:"#fef9e7",border:"2px solid #f39c12",borderRadius:7,padding:"11px 16px",marginBottom:mb}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.09em",color:"#b7770d",marginBottom:7}}>
            ⭐ {sp?"Instrucciones Específicas para Este Paciente":"Specific Instructions for This Patient"}
          </div>
          <BL items={output.specialInstructions} fs={fs} />
        </div>
      )}

      {output.therapyExercises && output.therapyExercises.length > 0 && (
        <Sec title={sp?"Ejercicios de Terapia":"Therapy Exercises"} ac={ac} mb={mb}>
          {output.therapyExercises.map((ex,i)=>(
            <div key={i} style={{border:"1px solid #dde",borderRadius:6,padding:"10px 14px",marginBottom:8,background:"#fafbfc"}}>
              <div style={{fontSize:compact?11:13,fontWeight:700,color:ac,marginBottom:4}}>{i+1}. {ex.name}</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div>
                  <div style={{fontSize:10,fontWeight:700,color:"#555",textTransform:"uppercase",marginBottom:3}}>How to do it</div>
                  <div style={{fontSize:compact?10:12,color:"#333",lineHeight:1.6}}>{ex.description}</div>
                </div>
                <div>
                  <div style={{fontSize:10,fontWeight:700,color:"#555",textTransform:"uppercase",marginBottom:3}}>Frequency / Reps</div>
                  <div style={{fontSize:compact?10:12,color:"#333",lineHeight:1.6}}>{ex.reps}</div>
                </div>
              </div>
              {ex.precautions && (
                <div style={{marginTop:6,padding:"5px 10px",background:"#fdedec",borderRadius:4,fontSize:compact?10:11,color:"#c0392b"}}>
                  ⚠ <strong>Stop if:</strong> {ex.precautions}
                </div>
              )}
            </div>
          ))}
        </Sec>
      )}

      {output.diet && (
        <Sec title={sp?"Dieta y Nutrición":"Diet & Nutrition"} ac={ac} mb={mb}>
          <p style={{fontSize:10,color:"#555",fontStyle:"italic",marginBottom:8}}>{output.diet.intro}</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div style={{background:"#eafaf1",borderRadius:6,padding:"9px 12px"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#1e8449",textTransform:"uppercase",marginBottom:5}}>✓ {sp?"Comer / Hacer":"Eat / Do"}</div>
              <BL items={output.diet.eat} fs={compact?10:11} color="#1e8449" />
            </div>
            <div style={{background:"#fdedec",borderRadius:6,padding:"9px 12px"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#c0392b",textTransform:"uppercase",marginBottom:5}}>✗ {sp?"Evitar":"Avoid"}</div>
              <BL items={output.diet.avoid} fs={compact?10:11} color="#c0392b" />
            </div>
          </div>
        </Sec>
      )}

      <Sec title={sp?"Sus Zonas de Acción":"Your Action Zones"} ac={ac} mb={mb}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
          <ZC zone={output.greenZone} color="#27ae60" bg="#eafaf1" tc="#1e8449" compact={compact} />
          <ZC zone={output.yellowZone} color="#f39c12" bg="#fef9e7" tc="#b7770d" compact={compact} />
          <ZC zone={output.redZone} color="#e74c3c" bg="#fdedec" tc="#c0392b" compact={compact} />
        </div>
      </Sec>

      <div style={{background:"#eaf0fb",border:`2px solid ${ac}`,borderRadius:7,padding:"11px 16px",marginBottom:mb}}>
        <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.09em",color:ac,marginBottom:7}}>
          📞 {sp?"Llame a su enfermera o médico si nota:":"Call Your Nurse or Doctor If You Notice:"}
        </div>
        <BL items={output.callNurseIf} fs={fs} />
      </div>

      <div style={{textAlign:"center",borderTop:"1px solid #ddd",paddingTop:12}}>
        <div style={{fontSize:compact?11:13,fontStyle:"italic",color:"#555",marginBottom:4}}>{output.footer}</div>
        <div style={{fontSize:9,color:"#bbb"}}>{settings.customDisclaimer||"This handout is for educational purposes only and does not replace the advice of your healthcare provider."}</div>
      </div>

      {/* Manual write-in area — editable on screen, prints as a notes box */}
      <div style={{marginTop:14,border:"1px dashed #ccd6e0",borderRadius:7,padding:"12px 16px"}}>
        <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.09em",color:"#888",marginBottom:8}}>
          📝 Additional Notes / Instructions
        </div>
        <textarea
          value={manualNotes}
          onChange={e=>setManualNotes(e.target.value)}
          placeholder="Write any additional notes, instructions, or reminders here — these will appear on the printed handout..."
          style={{width:"100%",border:"none",outline:"none",resize:"none",fontSize:compact?11:13,color:"#333",lineHeight:1.7,fontFamily:"Georgia,serif",background:"transparent",minHeight:60}}
        />
        {!manualNotes && <div style={{fontSize:10,color:"#bbb",marginTop:4,fontStyle:"italic"}}>This area prints as a notes section on the handout.</div>}
      </div>
    </div>
  );
}

function Sec({title,ac,mb,children}) {
  return <div style={{marginBottom:mb}}><div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:ac,borderBottom:"1px solid #dde",paddingBottom:4,marginBottom:8}}>{title}</div>{children}</div>;
}
function BL({items,fs=12,color="#333"}) {
  return <ul style={{paddingLeft:17}}>{items.map((it,i)=><li key={i} style={{fontSize:fs,lineHeight:1.75,color}}>{it}</li>)}</ul>;
}
function ZC({zone,color,bg,tc,compact}) {
  return (
    <div style={{background:bg,border:`2px solid ${color}`,borderRadius:7,padding:compact?"9px 11px":"12px 14px"}}>
      <div style={{fontSize:compact?11:12,fontWeight:700,color:tc,marginBottom:4}}>{zone.label}</div>
      <div style={{fontSize:10,color:"#555",lineHeight:1.5,marginBottom:5}}>{zone.description}</div>
      <ul style={{paddingLeft:15}}>{zone.signs.map((s,i)=><li key={i} style={{fontSize:10,lineHeight:1.6,color:"#333"}}>{s}</li>)}</ul>
      <div style={{fontSize:10,fontWeight:700,marginTop:6,color:tc}}>{zone.action}</div>
    </div>
  );
}
function CI({label,value,ac,bold,red}) {
  return <div><div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.07em",color:ac,marginBottom:2}}>{label}</div><div style={{fontSize:12,color:red?"#c0392b":"#333",fontWeight:bold?700:400}}>{value}</div></div>;
}
function TabBtn({active,ac,onClick,children}) {
  return <button onClick={onClick} style={{background:active?"white":"transparent",color:active?ac:"white",border:active?"none":"1px solid rgba(255,255,255,0.4)",borderRadius:6,padding:"7px 16px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{children}</button>;
}
function FLabel({ac,children}) {
  return <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",color:ac,marginBottom:10,marginTop:4}}>{children}</div>;
}
const lbl = {display:"block",fontSize:11,fontWeight:600,color:"#555",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.06em"};
const inp = {width:"100%",border:"1px solid #d0d8e4",borderRadius:6,padding:"9px 12px",fontSize:13,color:"#222",background:"#fafbfc",outline:"none"};

// ── Access Gate ──────────────────────────────────────────────────────────────
function AccessGate() {
  const [checking, setChecking] = useState(true);
  const [authorized, setAuthorized] = useState(false);
  const [agencyName, setAgencyName] = useState("");
  const [code, setCode] = useState("");
  const [error, setError] = useState(null);
  const [verifying, setVerifying] = useState(false);

  useEffect(() => {
    const saved = localStorage.getItem("careready_access_code");
    if (saved) {
      verifyCode(saved, true);
    } else {
      setChecking(false);
    }
  }, []);

  const verifyCode = async (codeToCheck, isAutoCheck) => {
    if (!isAutoCheck) setVerifying(true);
    setError(null);
    try {
      const res = await fetch("/api/verify-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: codeToCheck }),
      });
      const data = await res.json();
      if (data.valid) {
        localStorage.setItem("careready_access_code", codeToCheck.trim().toUpperCase());
        setAgencyName(data.agencyName || "");
        setAuthorized(true);
      } else {
        localStorage.removeItem("careready_access_code");
        if (!isAutoCheck) setError("That code isn't valid. Please check with your administrator.");
      }
    } catch {
      if (!isAutoCheck) setError("Couldn't verify code. Check your connection and try again.");
    } finally {
      setChecking(false);
      setVerifying(false);
    }
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!code.trim()) return;
    verifyCode(code);
  };

  if (checking) {
    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f0f4f8",fontFamily:"'Inter','Segoe UI',sans-serif"}}>
        <div style={{color:"#888",fontSize:14}}>Loading CareReady…</div>
      </div>
    );
  }

  if (authorized) {
    return <App agencyName={agencyName} />;
  }

  return (
    <div style={{minHeight:"100vh",background:"#f0f4f8",fontFamily:"'Inter','Segoe UI',sans-serif",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"white",borderRadius:12,padding:"36px 32px",maxWidth:380,width:"100%",boxShadow:"0 2px 12px rgba(0,0,0,0.08)"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:11,letterSpacing:"0.12em",textTransform:"uppercase",color:"#888",marginBottom:4}}>Patient Education</div>
          <div style={{fontSize:24,fontWeight:700,color:"#1a5276"}}>CareReady</div>
        </div>
        <form onSubmit={handleSubmit}>
          <label style={lbl}>Access Code</label>
          <input
            value={code}
            onChange={e=>setCode(e.target.value)}
            placeholder="Enter your agency access code"
            style={{...inp,marginBottom:12,fontSize:16,textAlign:"center",letterSpacing:"0.05em",textTransform:"uppercase"}}
            autoCapitalize="characters"
            autoFocus
          />
          {error && <div style={{color:"#c0392b",fontSize:13,marginBottom:12,textAlign:"center"}}>{error}</div>}
          <button type="submit" disabled={verifying} style={{width:"100%",background:verifying?"#aaa":"#1a5276",color:"white",border:"none",borderRadius:6,padding:"11px",fontSize:14,fontWeight:600,cursor:verifying?"not-allowed":"pointer"}}>
            {verifying?"Checking…":"Unlock CareReady"}
          </button>
        </form>
        <div style={{marginTop:18,fontSize:12,color:"#999",textAlign:"center",lineHeight:1.6}}>
          Don't have a code? Contact your agency administrator to set up access.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AccessGate />);
  </script>
</body>
